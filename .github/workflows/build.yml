name: Build Firmware & LittleFS


on:
  pull_request:
    branches: [ master, main ]
    paths:
      - 'src/**'
      - 'include/**'
      - 'lib/**'
      - 'test/**'
      - 'tools/settings-deps/**'
      - 'tools/api/**'
      - 'tools/dashboard/**'
      - 'docs/api/rest.md'
      - 'docs/reference/settings-dependencies.md'
      - 'web/src/**'
      - 'web/package.json'
      - 'web/package-lock.json'
      - 'web/tsconfig.json'
      - 'web/vite.config.ts'
      - 'web/vitest.config.ts'
      - 'web/index.html'
      - 'web/public/**'
      - 'platformio.ini'
      - 'partitions.csv'
      - 'partitions_ble.csv'
      - 'scripts/**'
      - 'tools/ui/**'
      - '.github/workflows/build.yml'
      - 'specs/**'
      - '.specify/**'
  push:
    tags: [ 'v*' ]

# Cancel in-progress PR builds when new commits are pushed.
# Tag builds are never cancelled — releases must complete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Cache PlatformIO build
        uses: actions/cache@v4
        with:
          path: .pio/build
          key: ${{ runner.os }}-pio-build-${{ hashFiles('platformio.ini', 'src/**', 'include/**', 'partitions.csv') }}
          restore-keys: |
            ${{ runner.os }}-pio-build-

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: web/node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('web/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install PlatformIO and esptool
        run: pip install platformio esptool

      # Stamp version.h with the git tag so the firmware reports its release version
      - name: Inject release version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          sed -i "s/#define FIRMWARE_VERSION \".*\"/#define FIRMWARE_VERSION \"${VERSION}\"/" include/version.h

      - name: Install web dependencies
        run: npm ci
        working-directory: web

      - name: Typecheck web UI
        run: npm run typecheck
        working-directory: web

      - name: Run web unit tests with coverage
        run: npm run test:coverage
        working-directory: web

      - name: Upload web coverage report
        uses: actions/upload-artifact@v4
        with:
          name: web-coverage
          path: web/coverage/
          retention-days: 14

      - name: Build web UI
        run: npm run build
        working-directory: web

      - name: Integrity checks
        run: |
          # The owner's prompts stay out of the repository (constitution, Development Workflow)
          # (the constitution states the rule, so it names the pattern)
          if grep -rn --exclude=constitution.md "User description" specs/ .specify/ 2>/dev/null; then
            echo "ERROR: a spec quotes the owner's prompt (**Input**: User description) - describe the feature in the spec's own words"
            exit 1
          fi
          echo "No prompts in specs check passed"

          # No active TCPServer code references (firmware source and UI code only)
          if grep -rn "TCPServer\|WiFiServer.*2020" src/ include/ web/src/ 2>/dev/null; then
            echo "ERROR: TCPServer / port 2020 server reference found in firmware or UI code"
            exit 1
          fi
          echo "TCPServer code check passed"

          # No user-guide or getting-started docs advertising port 2020 as active
          if grep -rn "port 2020" docs/user-guide/ docs/getting-started/ docs/hardware/ docs/reference/ README.md 2>/dev/null; then
            echo "ERROR: port 2020 referenced as active functionality in product docs"
            exit 1
          fi
          echo "Port 2020 docs check passed"

          # No serializeJsonPretty in config persistence
          if grep -rn "serializeJsonPretty" src/ include/ lib/ 2>/dev/null; then
            echo "ERROR: serializeJsonPretty found in firmware (config persistence must use compact JSON)"
            exit 1
          fi
          echo "serializeJsonPretty check passed"

      - name: Run native unit tests
        run: pio test -e native

      # Every setting that depends on another is catalogued, implemented on the
      # device and in the web UI's preview, tested, and documented
      # (specs/020-settings-dependencies).
      - name: Settings dependencies catalogue
        run: |
          python3 tools/settings-deps/test_check.py
          python3 tools/settings-deps/check.py

      # Every language file is complete and the generated i18n files are
      # current; the language files build within the device's size limit
      # (specs/023-i18n).
      - name: Translations
        run: |
          python3 -m unittest discover -s tools/i18n -p 'test_*.py'
          node tools/i18n/check.mjs
          node tools/i18n/literals.mjs
          python3 tools/i18n/gen_device_catalog.py --check
          python3 tools/i18n/context.py --check
          python3 tools/i18n/build_packs.py --version 0.0.0-ci --out "$RUNNER_TEMP/i18n"

      # Every device field and settings dependency is on the dashboard
      # inventory, shown with a test or not shown with a reason (specs/025).
      - name: Dashboard inventory
        run: |
          python3 -m unittest discover -s tools/dashboard -p 'test_*.py'
          python3 tools/dashboard/check.py

      # Every HTTP route is declared with its auth and documented
      # (specs 011 FR-006, 014 FR-005).
      - name: API routes registry
        run: |
          python3 tools/api/test_routes.py
          python3 tools/api/routes.py
          python3 tools/test_contract_check.py

      # The demo runs this firmware code in the browser (web/src/demo/core);
      # a change to lib/ must ship with a rebuilt core.
      - name: Demo device core is current
        run: python3 tools/demo-core/source_hash.py --check

      # The UI is stored gzipped; it must fit the LittleFS partition with a
      # language file and headroom, and grow no more than 10 KB per change
      # (coding standard SIZE-01, SIZE-02).
      - name: Pack the web UI for LittleFS and check its size
        run: |
          python3 -m unittest tools/ui/test_ui_size.py
          python3 tools/ui/pack_data.py --dist web/dist --out data
          if [ -n "${BASE_REF}" ]; then
            git fetch --depth=1 origin "${BASE_REF}"
            python3 tools/ui/size_check.py --data data --base-ref FETCH_HEAD
          else
            python3 tools/ui/size_check.py --data data
          fi
        env:
          BASE_REF: ${{ github.base_ref }}

      - name: Build firmware
        run: pio run

      - name: Build LittleFS image
        run: pio run --target buildfs

      # Optional BLE variant (larger app partitions, see partitions_ble.csv).
      # Shares the standard LittleFS image - same 512 KB size.
      - name: Build BLE firmware
        run: pio run -e esp32dev-ble

      # Merge all pieces into a single binary for fresh ESP32 flashing.
      # NVS (0x9000) is intentionally excluded — it is user config and should
      # start empty so the device can be configured via the web UI on first boot.
      - name: Create complete flash image
        run: |
          BOOT_APP0=$(find ~/.platformio -name "boot_app0.bin" | head -1)
          esptool.py --chip esp32 merge_bin \
            -o .pio/build/esp32dev/complete-flash.bin \
            --flash_mode dio \
            --flash_freq 40m \
            --flash_size 4MB \
            0x1000  .pio/build/esp32dev/bootloader.bin \
            0x8000  .pio/build/esp32dev/partitions.bin \
            0xe000  "${BOOT_APP0}" \
            0x10000 .pio/build/esp32dev/firmware.bin \
            0x310000 .pio/build/esp32dev/littlefs.bin
          esptool.py --chip esp32 merge_bin \
            -o .pio/build/esp32dev-ble/complete-flash.bin \
            --flash_mode dio \
            --flash_freq 40m \
            --flash_size 4MB \
            0x1000  .pio/build/esp32dev-ble/bootloader.bin \
            0x8000  .pio/build/esp32dev-ble/partitions.bin \
            0xe000  "${BOOT_APP0}" \
            0x10000 .pio/build/esp32dev-ble/firmware.bin \
            0x380000 .pio/build/esp32dev/littlefs.bin

      # PR builds: keep 5 days (inspection only). Tag builds go into GitHub Releases permanently.
      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: .pio/build/esp32dev/firmware.bin
          if-no-files-found: error
          retention-days: ${{ startsWith(github.ref, 'refs/tags/') && 90 || 5 }}

      - name: Upload LittleFS artifact
        uses: actions/upload-artifact@v4
        with:
          name: littlefs
          path: .pio/build/esp32dev/littlefs.bin
          if-no-files-found: error
          retention-days: ${{ startsWith(github.ref, 'refs/tags/') && 90 || 5 }}

      - name: Upload complete flash artifact
        uses: actions/upload-artifact@v4
        with:
          name: complete-flash
          path: .pio/build/esp32dev/complete-flash.bin
          if-no-files-found: error
          retention-days: ${{ startsWith(github.ref, 'refs/tags/') && 90 || 5 }}

      - name: Upload BLE firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-ble
          path: .pio/build/esp32dev-ble/firmware.bin
          if-no-files-found: error
          retention-days: ${{ startsWith(github.ref, 'refs/tags/') && 90 || 5 }}

      - name: Upload BLE complete flash artifact
        uses: actions/upload-artifact@v4
        with:
          name: complete-flash-ble
          path: .pio/build/esp32dev-ble/complete-flash.bin
          if-no-files-found: error
          retention-days: ${{ startsWith(github.ref, 'refs/tags/') && 90 || 5 }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4

      # The language files the device downloads for this firmware version
      # (specs/023-i18n): sqmeter-i18n-<code>.json.gz, its .sha256 and the manifest.
      - name: Build language files
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          python3 tools/i18n/build_packs.py --version "${VERSION}" --out i18n

      - name: Rename binaries with version tag
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          mv firmware/firmware.bin             sqmeter-firmware-${VERSION}.bin
          mv littlefs/littlefs.bin             sqmeter-littlefs-${VERSION}.bin
          mv complete-flash/complete-flash.bin sqmeter-complete-flash-${VERSION}.bin
          mv firmware-ble/firmware.bin             sqmeter-ble-firmware-${VERSION}.bin
          mv complete-flash-ble/complete-flash.bin sqmeter-ble-complete-flash-${VERSION}.bin

      # Any tag with a semver prerelease segment (e.g. v0.1.4-beta.1) is
      # published as a GitHub prerelease, which is what the device's
      # "Check for Updates" beta track filters on (GitHub's prerelease flag,
      # not tag naming - see OtaUpdater::parseGithubReleases).
      - name: Determine prerelease status
        id: prerelease
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          if [[ "$VERSION" == *-* ]]; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: SQMeter ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ steps.prerelease.outputs.value }}
          files: |
            sqmeter-firmware-*.bin
            sqmeter-littlefs-*.bin
            sqmeter-complete-flash-*.bin
            sqmeter-ble-firmware-*.bin
            sqmeter-ble-complete-flash-*.bin
            i18n/sqmeter-i18n-*
