name: Deploy Docs & Demo

on:
  pull_request:
    branches: [ master, main ]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'overrides/**'
      - 'README.md'
      - 'tools/docs/**'
      - 'web/**'
      - '.github/workflows/docs.yml'
  push:
    branches: [ main, master ]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'overrides/**'
      - 'README.md'
      - 'tools/docs/**'
      - 'web/**'
      - '.github/workflows/docs.yml'

# Cancel an in-progress docs deploy when a newer push lands on main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: web/node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('web/package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-

      - name: Install MkDocs Material
        run: pip install -r docs/requirements.txt

      - name: Install web dependencies
        run: npm ci
        working-directory: web

      - name: Typecheck web UI
        run: npm run typecheck
        working-directory: web

      - name: Init MSW service worker
        run: npx msw init public/ --save
        working-directory: web

      - name: Build demo site
        run: npm run build:demo
        working-directory: web

      - name: Take screenshots
        run: npm run screenshots
        working-directory: web

      # Every page and state of the device UI, at desktop and 320 px, against
      # web/tests/a11y/baseline.json (spec 022).
      - name: Accessibility checks (device UI)
        run: npx playwright test tests/a11y.spec.ts tests/a11y-announce.spec.ts
        working-directory: web

      # Diagrams (spec 024): the site serves its own pinned mermaid, every
      # diagram must parse and render, and no page may use a CDN.
      - name: Vendor mermaid for the docs
        run: npm run docs:vendor
        working-directory: web

      - name: Render every diagram
        run: npm run docs:diagrams
        working-directory: web

      - name: Build MkDocs site
        run: mkdocs build --strict

      - name: Accessibility checks (docs)
        run: npx playwright test -c playwright.docs.config.ts
        working-directory: web

      - name: Site serves its own mermaid
        run: python3 tools/docs/diagrams.py --site site

      # The demo has its own site, https://demo.sqmeter.dev, served by GitHub
      # Pages from DeanJ87/sqmeter-demo (one custom domain per Pages site).
      # site/demo/ is just a redirect for old links.
      - name: Publish demo to demo.sqmeter.dev
        if: github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.DEMO_DEPLOY_KEY }}
          external_repository: DeanJ87/sqmeter-demo
          publish_branch: gh-pages
          publish_dir: ./web/dist-demo
          cname: demo.sqmeter.dev
          force_orphan: true
          commit_message: "Demo from DeanJ87/SQMeter@${{ github.sha }}"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
