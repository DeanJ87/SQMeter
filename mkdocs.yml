site_name: SQMeter
site_description: ESP32 Dark Sky Quality Monitor
site_url: https://DeanJ87.github.io/SQMeter/
repo_url: https://github.com/DeanJ87/SQMeter
repo_name: DeanJ87/SQMeter
edit_uri: edit/main/docs/

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/DeanJ87/SQMeter
      name: GitHub
    - icon: material/monitor-eye
      link: https://DeanJ87.github.io/SQMeter/demo/
      name: Live Demo

theme:
  name: material
  # Dark only, in the device UI's colours (docs/stylesheets/sqmeter.css).
  palette:
    scheme: slate
    primary: custom
    accent: custom
  font: false # Inter and JetBrains Mono ship with the site, like the device UI
  logo: assets/logo.svg
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github
  favicon: assets/favicon.svg

extra_css:
  - stylesheets/sqmeter.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Live Demo: live-demo.md
  - Getting Started:
    - Flashing Your Device: getting-started/flashing.md
    - Hardware Setup: getting-started/hardware.md
    - First Boot: getting-started/first-setup.md
  - User Guide:
    - Dashboard: user-guide/dashboard.md
    - Configuration: user-guide/configuration.md
    - Security: user-guide/security.md
    - MQTT Integration: user-guide/mqtt.md
    - OTA Updates: user-guide/ota.md
    - ASCOM Alpaca: user-guide/alpaca.md
    - Alerts: user-guide/alerts.md
    - Bluetooth (BLE): user-guide/ble.md
  - Hardware:
    - Overview: hardware/overview.md
    - RG-15 Rain Sensor: hardware/rg15.md
    - Wind (anemometer): hardware/wind.md
    - Schematic: hardware/schematic.md
    - PCB: hardware/pcb.md
    - Enclosure: hardware/enclosure.md
    - Bill of Materials: hardware/bom.md
    - Assembly: hardware/assembly.md
  - API Reference:
    - REST API: api/rest.md
    - WebSocket: api/websocket.md
    - Integrations: api/integrations.md
  - Development:
    - ADR 001 Sky Optics: development/adr-001-sky-optics-and-averaging.md
    - Dev Workflow: development/workflow.md
    - Adding Sensors: development/sensors.md
    - Contributing: development/contributing.md
  - Reference:
    - Sky Quality Calculations: reference/sky-quality.md
    - Troubleshooting: reference/troubleshooting.md
