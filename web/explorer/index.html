<!doctype html>
<html lang="en" class="dark-mode">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Try the SQMeter REST API against the demo's emulated device" />
    <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="../favicon-32.png" />
    <title>SQMeter API explorer</title>
  </head>
  <body>
    <header class="explorer-bar">
      <span class="explorer-brand">SQMeter API</span>
      <span class="explorer-note" id="explorer-note"
        >Requests go to the demo's emulated SQMeter in this browser. Nothing is sent anywhere.</span
      >
      <nav class="explorer-links" aria-label="Explorer">
        <a href="../">Demo</a>
        <a id="explorer-docs" href="https://sqmeter.dev/api/reference/">API reference</a>
      </nav>
    </header>
    <main id="explorer" aria-label="API explorer"></main>
    <script type="module" src="/src/demo/explorer/main.ts"></script>
  </body>
</html>
