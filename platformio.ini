; PlatformIO Project Configuration for SQM v2
; Modern ESP32 Dark Sky Monitoring System

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; C++17 with strict warnings
build_flags = 
    -std=gnu++17
    -Wall
    -Wextra
    -Werror
    -Wno-implicit-fallthrough
    -DCORE_DEBUG_LEVEL=3
    -DCONFIG_ASYNC_TCP_RUNNING_CORE=1
    -DCONFIG_ASYNC_TCP_USE_WDT=1
    ; A slow WebSocket client (weak WiFi) could otherwise pin 32 queued
    ; multi-KB sensor/status messages each.
    -DWS_MAX_QUEUED_MESSAGES=4
    ; AsyncTCP defaults to a 16 KB task stack; measured peak is ~6.8 KB
    ; (GitHub update check, TLS in the handler), so 11 KB keeps a margin.
    -DCONFIG_ASYNC_TCP_STACK_SIZE=11264

build_unflags = 
    -std=gnu++11

; Dependencies
lib_deps = 
    adafruit/Adafruit TSL2591 Library@^1.4.1
    adafruit/Adafruit BME280 Library@^2.2.2
    adafruit/Adafruit MLX90614 Library@^2.1.3
    adafruit/Adafruit Unified Sensor@^1.1.9
    bblanchon/ArduinoJson@^6.21.3
    knolleary/PubSubClient@^2.8.0
    mikalhart/TinyGPSPlus@^1.0.3
    https://github.com/me-no-dev/ESPAsyncWebServer.git#ad3741d159f9cfd50c567e81b67f3bef1dc6d89f
    https://github.com/me-no-dev/AsyncTCP.git#ef448a8a1dffe4ec1b72326dd5a26211ff227b49

; Monitor settings
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Filesystem settings
board_build.filesystem = littlefs
board_build.partitions = partitions.csv

; Upload settings
upload_speed = 115200
upload_protocol = esptool  ; Default to serial, can override with --upload-port IP

; Build web UI before uploading filesystem
extra_scripts =
    pre:scripts/build_web.py

; Optional BLE build: everything in esp32dev plus a NimBLE GATT service
; (safety, rain, alerts, sensor summary). Needs the larger app partitions in
; partitions_ble.csv, so the first install must be over USB:
;   pio run -e esp32dev-ble -t upload && pio run -e esp32dev-ble -t uploadfs
; GitHub OTA updates then fetch the matching "sqmeter-ble-firmware-*" asset.
[env:esp32dev-ble]
extends = env:esp32dev
board_build.partitions = partitions_ble.csv
build_flags =
    ${env:esp32dev.build_flags}
    -DSQM_ENABLE_BLE=1
    -DCONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=2
    -DCONFIG_BT_NIMBLE_MSYS1_BLOCK_COUNT=8
lib_deps =
    ${env:esp32dev.lib_deps}
    h2zero/NimBLE-Arduino@^1.4.3

; Native (desktop) unit-test environment for platform-independent logic
; only (lib/AlpacaLogic) - no ESP32 toolchain, no hardware, fast CI feedback.
[env:native]
platform = native
test_framework = unity
lib_deps =
    bblanchon/ArduinoJson@^6.21.3
build_flags =
    -std=gnu++17
    -Ilib/AlpacaLogic/include
    -Ilib/AlertLogic/include
    -Ilib/BleLogic/include
    -Ilib/WindLogic/include
    -Ilib/Readings/include
    -Ilib/ReleaseLogic/include
    -Ilib/SkyLogic/include
    -Ilib/RainLogic/include
    -Ilib/SafetyHistoryLogic/include
    -Ilib/CaptiveDns/include
    -Ilib/SensorTypes/include
    -Ilib/ConfigModel/include
    -Ilib/DeviceCore/include
