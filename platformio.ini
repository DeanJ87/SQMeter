; PlatformIO Project Configuration for SQM v2
; Modern ESP32 Dark Sky Monitoring System

[platformio]
default_envs = esp32dev

[env:esp32dev]
; Arduino-ESP32 3.3.12 / ESP-IDF 5.5.5 (spec 027). Needs PlatformIO Core >= 6.2.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32dev
framework = arduino

; C++17; strict warnings for our own sources only (build_src_flags) - the 3.x
; toolchain is GCC 14 and third-party libraries trip its new deprecations.
build_flags = 
    -std=gnu++17
    ; Arduino core logs errors only in release builds; SQM's Logger is unaffected.
    -DCORE_DEBUG_LEVEL=1
    -DCONFIG_ASYNC_TCP_RUNNING_CORE=1
    -DCONFIG_ASYNC_TCP_USE_WDT=1
    ; A slow WebSocket client (weak WiFi) could otherwise pin 32 queued
    ; multi-KB sensor/status messages each.
    -DWS_MAX_QUEUED_MESSAGES=4
    ; AsyncTCP defaults to a 16 KB task stack; measured peak is ~6.8 KB
    ; (GitHub update check, TLS in the handler), so 11 KB keeps a margin.
    -DCONFIG_ASYNC_TCP_STACK_SIZE=11264

build_unflags = 
    -std=gnu++11
    -std=gnu++2b

build_src_flags =
    -Wall
    -Wextra
    -Werror
    -Wno-implicit-fallthrough

; Dependencies
lib_deps = 
    adafruit/Adafruit TSL2591 Library@^1.4.1
    adafruit/Adafruit BME280 Library@^2.2.2
    adafruit/Adafruit MLX90614 Library@^2.1.3
    adafruit/Adafruit Unified Sensor@^1.1.9
    bblanchon/ArduinoJson@^6.21.3
    knolleary/PubSubClient@^2.8.0
    mikalhart/TinyGPSPlus@^1.0.3
    ESP32Async/ESPAsyncWebServer@3.12.0
    ESP32Async/AsyncTCP@3.5.0

; Monitor settings
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; ESP-IDF options, applied by rebuilding the framework (pioarduino hybrid
; compile). scripts/check_sdkconfig.py fails the build if any line here didn't
; land in the generated sdkconfig (FR-010: options get renamed between IDF
; releases). WPA3 stays on (spec 027 clarification).
custom_sdkconfig =
    CONFIG_LOG_DEFAULT_LEVEL_ERROR=y
    CONFIG_LOG_MAXIMUM_EQUALS_DEFAULT=y
    CONFIG_ESP_ERR_TO_NAME_LOOKUP=n
    CONFIG_ESP_COREDUMP_ENABLE_TO_NONE=y
    CONFIG_COMPILER_OPTIMIZATION_SIZE=y
    CONFIG_BOOTLOADER_APP_ROLLBACK_ENABLE=y
    CONFIG_ESP_WIFI_ENTERPRISE_SUPPORT=n
    CONFIG_BT_ENABLED=n
    CONFIG_MBEDTLS_TLS_SERVER=n
    CONFIG_MBEDTLS_TLS_SERVER_AND_CLIENT=n
    CONFIG_MBEDTLS_TLS_CLIENT_ONLY=y
    CONFIG_MBEDTLS_CAMELLIA_C=n
    CONFIG_MBEDTLS_CCM_C=n
    CONFIG_MBEDTLS_XTEA_C=n
    CONFIG_MBEDTLS_SSL_PROTO_DTLS=n
    CONFIG_ESP_WIFI_WPS_SOFTAP_REGISTRAR=n
    CONFIG_ESP_WIFI_DPP_SUPPORT=n
    CONFIG_ESP_WIFI_11KV_SUPPORT=n
    CONFIG_ESP_WIFI_11R_SUPPORT=n
    CONFIG_ESP_WIFI_NAN_ENABLE=n
    CONFIG_ESP_WIFI_MESH_SUPPORT=n
    CONFIG_ESP_WIFI_FTM_ENABLE=n
    CONFIG_ESP_WIFI_GMAC_SUPPORT=n
    CONFIG_ESP_WIFI_ENABLE_WPA3_OWE_STA=n

; Filesystem settings: one whole-chip layout for both builds (spec 027).
board_build.filesystem = littlefs
board_build.partitions = partitions.csv

; Upload settings
upload_speed = 115200
upload_protocol = esptool  ; Default to serial, can override with --upload-port IP

; Build web UI before uploading filesystem; check the framework options landed.
extra_scripts =
    pre:scripts/build_web.py
    post:scripts/check_sdkconfig.py

; Optional BLE build: everything in esp32dev plus a NimBLE GATT service
; (safety, rain, alerts, sensor summary). Same partition layout as esp32dev;
; GitHub OTA updates fetch the matching "sqmeter-ble-firmware-*" asset.
[env:esp32dev-ble]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -DSQM_ENABLE_BLE=1
    -DCONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=2
    -DCONFIG_BT_NIMBLE_MSYS1_BLOCK_COUNT=8
    -DCONFIG_NIMBLE_CPP_LOG_LEVEL=0
    -DCONFIG_BT_NIMBLE_ROLE_BROADCASTER_DISABLED
lib_deps =
    ${env:esp32dev.lib_deps}
    h2zero/NimBLE-Arduino@2.5.1
custom_sdkconfig =
    ${env:esp32dev.custom_sdkconfig}
    CONFIG_BT_ENABLED=y
    CONFIG_BTDM_CTRL_MODE_BLE_ONLY=y
    CONFIG_BTDM_CTRL_MODE_BTDM=n
    CONFIG_BT_CONTROLLER_ONLY=y

; Native (desktop) unit-test environment for platform-independent logic
; only (lib/AlpacaLogic) - no ESP32 toolchain, no hardware, fast CI feedback.
[env:native]
platform = native
test_framework = unity
lib_deps =
    bblanchon/ArduinoJson@^6.21.3
build_flags =
    -std=gnu++17
    -Ilib/AlpacaLogic/include
    -Ilib/AlertLogic/include
    -Ilib/BleLogic/include
    -Ilib/WindLogic/include
    -Ilib/Readings/include
    -Ilib/ReleaseLogic/include
    -Ilib/SkyLogic/include
    -Ilib/RainLogic/include
    -Ilib/SafetyHistoryLogic/include
    -Ilib/CaptiveDns/include
    -Ilib/SensorTypes/include
    -Ilib/ConfigModel/include
    -Ilib/DeviceCore/include
    -Ilib/SettingsDeps/include
    -Ilib/LanguageLogic/include
    -Ilib/NetAddress/include
